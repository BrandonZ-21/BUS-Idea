<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Counter</title>
<meta name="description" content="Upload your sales export and see your busy hours, best sellers, and slow days in plain English. Everything stays on your device." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <a class="brand-name" id="brandName" href="#/home">Counter</a>
      <span class="private-badge" id="privateBadge">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3z"/></svg>
        <span id="privateBadgeText">Private to you</span>
      </span>
    </div>
    <nav class="main-nav" id="mainNav" aria-label="Main navigation"></nav>
    <div class="header-actions">
      <button type="button" class="btn btn-ghost" id="langToggleBtn">中文</button>
    </div>
  </div>
</header>

<main id="main-content">
  <div id="errorBanner" class="error-banner" role="alert" hidden></div>
  <div id="mergeBanner" class="merge-banner" role="status" hidden></div>

  <div id="bootStatus" role="status" style="text-align:center;color:#667085;padding:60px 20px;">Loading Counter…</div>

  <section id="view-match" class="view" hidden></section>
  <section id="view-root" class="view" hidden></section>
</main>

<div id="modalRoot"></div>

<footer class="site-footer">
  <p class="footer-privacy-note" id="footerPrivacyNote" role="note">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3z"/></svg>
    <span id="footerPrivacyText"></span>
  </p>
  <p id="footerNote"></p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/translations.js"></script>
<script src="js/holidays.js"></script>
<script src="js/weather.js"></script>
<script src="js/daylight.js"></script>
<script src="js/customers.js"></script>
<script src="js/business-tips.js"></script>
<script src="js/db.js"></script>
<script src="js/ask.js"></script>
<script src="js/parser.js"></script>
<script src="js/customer-summary.js"></script>
<script src="js/stats.js"></script>
<script src="js/charts.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
