<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Business-tips tests</title>
<style>
  body { font-family: monospace; padding: 24px; background: #fff; color: #111; }
  .pass { color: #1F5C4A; }
  .fail { color: #b3401f; font-weight: bold; }
  h1 { font-family: sans-serif; }
  #summary { font-family: sans-serif; font-size: 1.2em; margin-top: 16px; }
</style>
</head>
<body>
<h1>Business-tips tests</h1>
<p>Checks business-type detection, the menu-engineering quadrant split (hand-worked), and the curated tip-rule bank in <code>../js/business-tips.js</code>.</p>
<div id="results"></div>
<div id="summary"></div>

<script src="../js/business-tips.js"></script>
<script>
(() => {
  const results = [];
  let pass = 0, fail = 0;
  function assert(label, condition) {
    if (condition) pass++; else fail++;
    results.push({ label, ok: condition });
  }
  function assertEqual(label, actual, expected) {
    assert(`${label} (got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)})`, actual === expected);
  }
  function hasTip(tips, id) { return tips.some((t) => t.id === id); }

  // ---- detectBusinessType ----
  const cafeRows = ["Latte", "Croissant", "Espresso", "Blueberry Muffin"].map((item) => ({ item }));
  assertEqual("Cafe items detected as cafe", detectBusinessType(cafeRows), "cafe");

  const bakeryRows = ["Sourdough Bread", "Chocolate Cake", "Cinnamon Roll", "Baguette"].map((item) => ({ item }));
  assertEqual("Bakery items detected as bakery", detectBusinessType(bakeryRows), "bakery");

  const barRows = ["IPA Draft", "Margarita", "Red Wine", "Mojito"].map((item) => ({ item }));
  assertEqual("Bar items detected as bar", detectBusinessType(barRows), "bar");

  const restaurantRows = ["Grilled Salmon", "Ribeye Steak", "Caesar Salad", "Burrito Bowl"].map((item) => ({ item }));
  assertEqual("Restaurant items detected as restaurant", detectBusinessType(restaurantRows), "restaurant");

  const genericRows = ["Widget A", "Widget B", "Thing C"].map((item) => ({ item }));
  assertEqual("No keyword matches falls back to general", detectBusinessType(genericRows), "general");

  // ---- computeMenuEngineering ----
  // By hand: quantities [10, 10, 2, 2] -> sorted [2,2,10,10] -> median = (2+10)/2 = 6.
  //          prices [5, 3, 5, 3] -> sorted [3,3,5,5] -> median = (3+5)/2 = 4.
  //   A: qty 10 (>=6, popular), price 5 (>=4, pricier) -> star
  //   B: qty 10 (>=6, popular), price 3 (<4, cheaper)  -> plowhorse
  //   C: qty 2  (<6, rare),     price 5 (>=4, pricier)  -> puzzle
  //   D: qty 2  (<6, rare),     price 3 (<4, cheaper)   -> dog
  const menuRows = [
    { item: "A", quantity: 10, price: 5 },
    { item: "B", quantity: 10, price: 3 },
    { item: "C", quantity: 2, price: 5 },
    { item: "D", quantity: 2, price: 3 },
  ];
  const eng = computeMenuEngineering(menuRows);
  assertEqual("Median quantity", eng.medianQty, 6);
  assertEqual("Median price", eng.medianPrice, 4);
  const byItem = Object.fromEntries(eng.items.map((x) => [x.item, x.quadrant]));
  assertEqual("Item A classified as star", byItem.A, "star");
  assertEqual("Item B classified as plowhorse", byItem.B, "plowhorse");
  assertEqual("Item C classified as puzzle", byItem.C, "puzzle");
  assertEqual("Item D classified as dog", byItem.D, "dog");

  assertEqual("Fewer than 4 distinct items returns null (not enough for a median split)",
    computeMenuEngineering([{ item: "A", quantity: 5, price: 5 }, { item: "B", quantity: 5, price: 5 }]), null);

  // (The old generateBusinessTips rule bank was removed on 2026-10-27: it was never
  // called by the app. Data-driven advice now lives in js/insights.js and js/advice.js.)

  const el = document.getElementById("results");
  results.forEach((r) => {
    const div = document.createElement("div");
    div.className = r.ok ? "pass" : "fail";
    div.textContent = (r.ok ? "PASS - " : "FAIL - ") + r.label;
    el.appendChild(div);
  });
  document.getElementById("summary").innerHTML = fail === 0
    ? `<span class="pass">All ${pass} checks passed.</span>`
    : `<span class="fail">${fail} of ${pass + fail} checks FAILED.</span>`;
})();
</script>
</body>
</html>
